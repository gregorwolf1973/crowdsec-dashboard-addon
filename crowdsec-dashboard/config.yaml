name: "CrowdSec Dashboard"
description: "Web-UI zum Anzeigen und Verwalten von CrowdSec Bans und Alerts"
version: "1.4.2"
url: "https://github.com/gregorwolf1973/crowdsec-dashboard-addon"
slug: "crowdsec_dashboard"
init: false
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-bug
panel_title: CrowdSec
homeassistant_api: false
hassio_api: false
options:
  crowdsec_url: "http://424ccef4-crowdsec:8080"
  machine_id: "crowdsec-dashboard"
  machine_password: ""
  bouncer_api_key: ""
  log_level: "info"
schema:
  crowdsec_url: str
  machine_id: str
  machine_password: password
  bouncer_api_key: password
  log_level: list(debug|info|warning|error)
